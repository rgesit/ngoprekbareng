<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0b0f" />
    <script>
      // Terapkan tema tersimpan sebelum paint pertama, biar gak kedip.
      try {
        var saved = localStorage.getItem('theme')
        document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch (error) {}
    </script>
    <title>Assalimi — Portfolio & Pep Talk Gen Alpha</title>
    <meta name="description" content="Portfolio Assalimi: situs, alat belajar, dan cerita buat Gen Alpha (2010–2024) dan Gen Beta (2025+). Lo gak perlu jadi sigma buat jadi orang yang berguna." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
